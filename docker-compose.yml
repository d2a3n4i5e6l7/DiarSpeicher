services:
    diarspeicher:
        build:
            context: .
            dockerfile: Dockerfile
        image: diarspeicher:latest
        container_name: diarspeicher
        # La imagen corre como nonroot (65532) y los bind mounts son del usuario del host,
        # asi que el contenedor toma su uid/gid para poder escribir en /data.
        user: "${PUID:-1000}:${PGID:-1000}"
        environment:
            - Gateway__PathBase=${PATH_BASE:-}
            - Storage__PageCache__MaxBytes=${PAGE_CACHE_BYTES:-2147483648}
            - Storage__Upload__EnableUpload=${ENABLE_UPLOAD:-true}
            - Storage__Backup__Enabled=${ENABLE_BACKUP:-true}
            - Storage__Backup__IntervalHours=${BACKUP_INTERVAL_HOURS:-12}
        volumes:
            - ${STORAGE_PATH:-./storage}:/data
            - ${LIBRARIES_PATH:-./libraries}:/libraries:ro
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "3"
        networks:
            - default

networks:
    default:
        name: ${NETWORK_NAME:-gateway_net}
