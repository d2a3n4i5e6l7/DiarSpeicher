services:
    diarspeicher:
        image: diarspeicher:latest
        container_name: diarspeicher
        user: "0:0"
        mem_limit: 2g
        mem_reservation: 1g
        environment:
            - PUID=${PUID:-1000}
            - PGID=${PGID:-1000}
            - Gateway__PathBase=${PATH_BASE:-}
            - Storage__PageCache__MaxBytes=${PAGE_CACHE_BYTES:-2147483648}
            - Storage__Upload__EnableUpload=${ENABLE_UPLOAD:-true}
            - Storage__Backup__Enabled=${ENABLE_BACKUP:-true}
            - Storage__Backup__IntervalHours=${BACKUP_INTERVAL_HOURS:-12}
            - Libraries__Roots__0=/libraries
            - Libraries__Roots__1=/libraries-sdcard
            - Libraries__Roots__2=/libraries-hdd
            - Logging__LogLevel__Default=${LOG_LEVEL:-Information}
            - Logging__LogLevel__Microsoft=Warning
            - Storage__Watcher__WatchRootsOnly=true
        volumes:
            - ${STORAGE_PATH:-./storage}:/data
            - ${LIBRARIES_PATH:-./libraries}:/libraries
            - ${SDCARD_PATH:-/mnt/e/Mangas/SDCard}:/libraries-sdcard
            - ${HDD_PATH:-/mnt/e/Mangas/SDCard}:/libraries-hdd
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "3"
        networks:
            - default

networks:
    default:
        name: ${NETWORK_NAME:-gateway_net}
        external: true